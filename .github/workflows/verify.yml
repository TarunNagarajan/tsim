name: CPU CUDA verification
on: [push, pull_request, workflow_dispatch]
jobs:
  cuda-on-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang-18 g++-13 make
      - name: Cache local toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            .local/toolchain
            .local/build
          key: cuda-cpu-build-v2-${{ runner.os }}-${{ hashFiles('scripts/setup.py', 'scripts/engine_patches.py', 'patches/*.patch', 'include/tsim/*.hpp', '.gitmodules') }}
      - name: Build compiler and CPU runtime
        run: python3 tsim.py setup --jobs 2
      - name: Verify CUDA execution and tracing
        run: python3 tsim.py test
      - name: Verify core PTX conformance
        run: python3 tsim.py conformance
      - name: Verify CUDA feature and synchronization conformance
        run: python3 tsim.py source-conformance
      - name: Verify execution events and architecture inputs
        run: python3 tsim.py event-conformance
      - name: Verify register hazards and directed collective dependencies
        run: python3 tsim.py dependency-conformance
      - name: Verify memory transactions and cache components
        run: python3 tsim.py memory-conformance
      - name: Verify cache policy preservation and hierarchy traffic
        run: python3 tsim.py cache-conformance
      - name: Verify SM residency against NVIDIA SDK occupancy rules
        run: python3 tsim.py residency-conformance
      - name: Verify NVIDIA compiler allocations and resource provenance
        run: python3 tsim.py compiler-conformance
      - name: Verify SM issue scheduling, finite pipelines and resource lifetimes
        run: python3 tsim.py execution-conformance
      - name: Verify staged read fills, merged misses and finite service queues
        run: python3 tests/sector_read_components.py --out .local/sector-read-conformance
      - name: Preserve test reports and trace inspectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-cuda-verification
          path: |
            .local/verification
            .local/core-conformance
            .local/source-conformance
            .local/event-conformance
            .local/dependency-conformance
            .local/memory-conformance
            .local/cache-conformance
            .local/residency-conformance
            .local/compiler-conformance
            .local/execution-conformance
            .local/sector-read-conformance
          if-no-files-found: ignore
